name: Ajuste Volume exibicao Agenda

on:
  push:
    branches: [ajuste-volume-exibicao-agenda]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text()
          old = '${v.volumes}'
          new = '${formatarVolume(separarVolume(v.volumes).volume, separarVolume(v.volumes).unidade)}'
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'ocorrencias de volume inesperadas: {count}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Instalar dependencias
        working-directory: timoni-portal
        run: npm ci
      - name: Validar build
        working-directory: timoni-portal
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git diff --cached --quiet || git commit -m "fix: normaliza exibicao de Volume na Agenda Motorista"
          git push
