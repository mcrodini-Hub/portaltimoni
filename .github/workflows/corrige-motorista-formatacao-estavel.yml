name: Corrige Motorista formatacao estavel

on:
  push:
    paths:
      - '.github/workflows/corrige-motorista-formatacao-estavel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcoes isoladas
        shell: python
        run: |
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Anchor nao encontrado: {label}')
              return text.replace(old, new, 1)

          agenda = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = agenda.read_text(encoding='utf-8')

          # Mesma lista exibida pelo Estoque (aba Vendedores + fixos Araras).
          s = must_replace(
              s,
              'const AUTORIZADOS = ["Ciça", "Thais", "Jaqueline", "Jeovana", "Margareth", "Reginaldo", "Carol Araras"] as const;\n',
              'const AUTORIZADOS = ["Ciça", "Thais", "Jaqueline", "Jeovana", "Margareth", "Reginaldo", "Carol Araras"] as const;\n\nconst VENDEDORES_ESTOQUE = [\n  { nome: "Adriel", unidade: "rio_claro" },\n  { nome: "Carina", unidade: "rio_claro" },\n  { nome: "Ciça", unidade: "rio_claro" },\n  { nome: "Davi", unidade: "rio_claro" },\n  { nome: "Jaqueline", unidade: "rio_claro" },\n  { nome: "Jeovana", unidade: "rio_claro" },\n  { nome: "João", unidade: "rio_claro" },\n  { nome: "José Roberto", unidade: "rio_claro" },\n  { nome: "Marcelo", unidade: "rio_claro" },\n  { nome: "Rafaela", unidade: "rio_claro" },\n  { nome: "San", unidade: "rio_claro" },\n  { nome: "Yan", unidade: "araras" },\n  { nome: "Lyra", unidade: "araras" },\n  { nome: "Carolina", unidade: "araras" },\n  { nome: "Paulo", unidade: "araras" },\n  { nome: "Reginaldo", unidade: "araras" },\n  { nome: "Reinaldo", unidade: "araras" },\n  { nome: "Ciça", unidade: "araras" },\n  { nome: "Marcelo", unidade: "araras" },\n] as const;\n',
              'lista vendedores'
          )

          s = must_replace(
              s,
              'function horaCurta(hora?: string) {\n  return hora ? hora.slice(0, 5) : "--:--";\n}\n',
              'function horaCurta(hora?: string) {\n  return hora ? hora.slice(0, 5) : "";\n}\n',
              'hora opcional'
          )

          helper_old = '''function separarEndereco(endereco?: string) {\n  const valor = endereco || "";\n  const match = valor.match(/\\nLink:\\s*(https?:\\/\\/\\S+)/i);\n  return {\n    texto: valor.replace(/\\nLink:\\s*https?:\\/\\/\\S+/i, "").trim(),\n    link: match?.[1] || "",\n  };\n}\n'''
          helper_new = helper_old + '''\nfunction escaparRegex(valor: string) {\n  return valor.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");\n}\n\nfunction enderecoSemNumeroRepetido(endereco?: string, numero?: string) {\n  const texto = separarEndereco(endereco).texto;\n  const num = (numero || "").trim();\n  let partes = texto.split(/\\s+-\\s+/).map((parte) => parte.trim()).filter(Boolean);\n  if (!num) return partes.join(" - ");\n  partes = partes.filter((parte) => parte !== num);\n  if (partes[0]) {\n    const fim = new RegExp(`(?:\\\\s*[,\\-]?\\\\s*${escaparRegex(num)})+$`);\n    partes[0] = partes[0].replace(fim, "").replace(/[\\s,-]+$/, "").trim();\n  }\n  return partes.filter(Boolean).join(" - ");\n}\n\nfunction formatarEnderecoExibicao(endereco?: string, numero?: string, complemento?: string) {\n  const base = enderecoSemNumeroRepetido(endereco, numero);\n  const partes = base.split(/\\s+-\\s+/).map((parte) => parte.trim()).filter(Boolean);\n  const rua = partes.shift() || "";\n  const num = (numero || "").trim();\n  const comp = (complemento || "").trim();\n  const inicio = rua && num ? `${rua}, ${num}` : rua || num;\n  return [inicio, ...partes, comp && comp !== num ? comp : ""].filter(Boolean).join(" - ");\n}\n\nfunction pedidoTexto(valor?: string) {\n  return (valor || "").replace(/\\s*\\/\\s*/g, " ").replace(/\\s+/g, " ").trim();\n}\n'''
          s = must_replace(s, helper_old, helper_new, 'helpers endereco agenda')

          old_form = '''function formFromViagem(v: Viagem): FormState {\n  const bloqueio = v.tipoHorario === "Bloqueio";\n  const enderecoCompleto = [v.endereco, v.numero, v.complemento].filter(Boolean).join(" - ");\n  const match = enderecoCompleto.match(/\\nLink:\\s*(https?:\\/\\/\\S+)/i);\n  return {'''
          new_form = '''function formFromViagem(v: Viagem): FormState {\n  const bloqueio = v.tipoHorario === "Bloqueio";\n  const enderecoBase = v.endereco || "";\n  const match = enderecoBase.match(/\\nLink:\\s*(https?:\\/\\/\\S+)/i);\n  const enderecoLimpo = enderecoSemNumeroRepetido(enderecoBase, v.numero);\n  const cepEncontrado = enderecoLimpo.match(/\\b\\d{5}-?\\d{3}\\b/)?.[0] || "";\n  return {'''
          s = must_replace(s, old_form, new_form, 'formFromViagem inicio')
          s = must_replace(s, '    cep: "",\n    endereco: enderecoCompleto.replace(/\\nLink:\\s*https?:\\/\\/\\S+/i, "").trim(),', '    cep: cepEncontrado,\n    endereco: enderecoLimpo,', 'form endereco limpo')

          old_cep = '''      const endereco = [data.logradouro, data.bairro, [data.localidade, data.uf].filter(Boolean).join("/")].filter(Boolean).join(" - ");\n      const linkMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endereco)}`;\n      set("endereco", endereco);\n      set("numeroEndereco", "");\n      set("linkEndereco", "");\n      setErro("CEP localizado. Confirme o número do endereço para gerar o link do Google Maps.");\n      set("linkEndereco", linkMaps);'''
          new_cep = '''      const endereco = [data.logradouro, data.bairro, [data.localidade, data.uf].filter(Boolean).join("/"), formatarCep(cep)].filter(Boolean).join(" - ");\n      set("endereco", endereco);\n      set("numeroEndereco", "");\n      set("linkEndereco", "");\n      setErro("CEP localizado. Confirme o número do endereço para gerar o link do Google Maps.");'''
          s = must_replace(s, old_cep, new_cep, 'CEP com CEP e sem link prematuro')
          s = must_replace(s, '      const linkMaps = form.linkEndereco || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(enderecoCompleto)}`;', '      const linkMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(enderecoCompleto)}`;', 'maps com numero confirmado')

          old_seller = '<label className="text-sm font-medium text-slate-700">* Vendedor<select value={form.vendedor} onChange={(e) => set("vendedor", e.target.value)} className={fieldClass("vendedor")}><option value="">Selecione</option>{form.vendedor && !AUTORIZADOS.includes(form.vendedor as (typeof AUTORIZADOS)[number]) && <option value={form.vendedor}>{form.vendedor}</option>}{AUTORIZADOS.map((nome) => <option key={nome} value={nome}>{nome}</option>)}</select></label>'
          new_seller = '<label className="text-sm font-medium text-slate-700">* Vendedor<select value={form.vendedor} onChange={(e) => set("vendedor", e.target.value)} className={fieldClass("vendedor")}><option value="">Selecione</option>{form.vendedor && !VENDEDORES_ESTOQUE.some((item) => item.nome === form.vendedor && item.unidade === form.loja) && <option value={form.vendedor}>{form.vendedor}</option>}{VENDEDORES_ESTOQUE.filter((item) => item.unidade === form.loja).map((item) => <option key={`${item.unidade}-${item.nome}`} value={item.nome}>{item.nome}</option>)}</select></label>'
          s = must_replace(s, old_seller, new_seller, 'select vendedor estoque')
          s = must_replace(s, '<label className="text-sm font-medium text-slate-700">* Loja<select value={form.loja} onChange={(e) => set("loja", e.target.value)}', '<label className="text-sm font-medium text-slate-700">* Loja<select value={form.loja} onChange={(e) => { set("loja", e.target.value); set("vendedor", ""); }}', 'troca loja limpa vendedor')

          old_day_title = '<p className="font-semibold text-slate-950">{index + 1}. {v.tipoHorario || "Viagem"} {lojaLabel(v.loja)} | {horaCurta(v.horario)}{v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""}{v.vendedor ? ` | Vendedor: ${v.vendedor}` : ""}</p>'
          new_day_title = '<p className="font-semibold text-slate-950">{index + 1}. {v.tipoHorario === "Bloqueio" ? "Bloqueio | " : ""}{lojaLabel(v.loja)}{v.vendedor ? ` | Vend.: ${v.vendedor}` : ""}{v.horario ? ` | ${horaCurta(v.horario)}${v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""}` : ""}</p>'
          s = must_replace(s, old_day_title, new_day_title, 'titulo dia')
          s = must_replace(s, '<p className="mt-3 text-slate-900">{v.clienteFornecedor || ""}{v.numeroPedido ? ` · ${v.numeroPedido}` : ""}{v.volumes ? ` · Volume: ${v.volumes}` : ""}</p>', '<p className="mt-3 text-slate-900">{v.clienteFornecedor || ""}{pedidoTexto(v.numeroPedido) ? ` | ${pedidoTexto(v.numeroPedido)}` : ""}{v.volumes ? ` | Volume: ${v.volumes}` : ""}</p>', 'linha cliente dia')
          s = must_replace(s, '{[separarEndereco(v.endereco).texto, v.numero, v.complemento].filter(Boolean).join(" - ")}', '{formatarEnderecoExibicao(v.endereco, v.numero, v.complemento)}', 'endereco dia')

          # Semana: mantém formato compacto, mas aplica as mesmas linhas completas e endereço normalizado.
          old_week = '''                      <button key={v.id} type="button" onClick={() => abrirEditar(v)} className="block w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-left hover:bg-slate-100">\n                        <p className="text-sm font-semibold text-slate-950">{index + 1}. {lojaLabel(v.loja)}{v.vendedor ? ` | Vend.: ${v.vendedor}` : ""}{v.horario ? ` | ${horaCurta(v.horario)}` : ""}</p>\n                        {v.clienteFornecedor && <p className="mt-1 truncate text-xs text-slate-600">{v.clienteFornecedor}</p>}\n                      </button>'''
          new_week = '''                      <button key={v.id} type="button" onClick={() => abrirEditar(v)} className="block w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-left hover:bg-slate-100">\n                        <p className="text-sm font-semibold text-slate-950">{index + 1}. {v.tipoHorario === "Bloqueio" ? "Bloqueio | " : ""}{lojaLabel(v.loja)}{v.vendedor ? ` | Vend.: ${v.vendedor}` : ""}{v.horario ? ` | ${horaCurta(v.horario)}` : ""}</p>\n                        {v.tipoHorario !== "Bloqueio" && <>\n                          <p className="mt-2 text-sm font-medium text-slate-900">{v.clienteFornecedor || ""}{pedidoTexto(v.numeroPedido) ? ` | ${pedidoTexto(v.numeroPedido)}` : ""}{v.volumes ? ` | Volume: ${v.volumes}` : ""}</p>\n                          {v.endereco && <p className="mt-1 text-sm text-slate-700">{formatarEnderecoExibicao(v.endereco, v.numero, v.complemento)}</p>}\n                        </>}\n                      </button>'''
          s = must_replace(s, old_week, new_week, 'card semana')

          agenda.write_text(s, encoding='utf-8')

          leitura = Path('timoni-portal/app/motorista/motorista-leitura.tsx')
          t = leitura.read_text(encoding='utf-8')
          t = must_replace(t, helper_old, helper_new.replace('\nfunction pedidoTexto', '\nfunction pedidoTexto'), 'helpers endereco leitura')
          t = must_replace(t, '                      const endereco = [enderecoInfo.texto, v.numero, v.complemento].filter(Boolean).join(" - ");', '                      const endereco = formatarEnderecoExibicao(v.endereco, v.numero, v.complemento);', 'endereco leitura')
          t = must_replace(t, '<p className="mt-2 text-sm font-medium text-slate-900">{v.clienteFornecedor || ""} {v.numeroPedido || ""} {v.volumes ? `Volume: ${v.volumes}` : "Volume:"}</p>', '<p className="mt-2 text-sm font-medium text-slate-900">{v.clienteFornecedor || ""}{pedidoTexto(v.numeroPedido) ? ` | ${pedidoTexto(v.numeroPedido)}` : ""}{v.volumes ? ` | Volume: ${v.volumes}` : ""}</p>', 'linha cliente leitura')
          leitura.write_text(t, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx timoni-portal/app/motorista/motorista-leitura.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrige endereco formato e vendedores do Motorista"
          git push
