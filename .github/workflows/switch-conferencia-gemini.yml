name: Trocar conferencia para Gemini gratuito

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/switch-conferencia-gemini.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar alternativa sem cobranca da Vercel
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('timoni-portal/app/api/conferencia-pedidos/route.ts')
          text = route.read_text(encoding='utf-8')

          start = text.index('async function fileToContent(file: File) {')
          end = text.index('function parseJson(text: string) {')
          replacement = '''async function fileToGeminiPart(file: File) {
  const bytes = Buffer.from(await file.arrayBuffer());
  return {
    inlineData: {
      mimeType: file.type,
      data: bytes.toString("base64"),
    },
  };
}

function extractGeminiText(payload: unknown) {
  const data = payload as {
    candidates?: Array<{
      content?: { parts?: Array<{ text?: string }> };
    }>;
  };
  return data.candidates?.[0]?.content?.parts
    ?.map((part) => part.text || "")
    .join("")
    .trim() || "";
}

'''
          text = text[:start] + replacement + text[end:]

          old = '''    const formData = await request.formData();
    const pedidoFiles = getFiles(formData, "pedido");'''
          new = '''    const formData = await request.formData();
    const providedGeminiKey = formData.get("geminiApiKey");
    const geminiApiKey =
      process.env.GEMINI_API_KEY ||
      (typeof providedGeminiKey === "string" ? providedGeminiKey.trim() : "");

    if (!geminiApiKey) {
      return NextResponse.json(
        { error: "Cole a chave gratuita do Google AI Studio para realizar a conferência." },
        { status: 503 },
      );
    }

    const pedidoFiles = getFiles(formData, "pedido");'''
          if old not in text:
              raise SystemExit('Trecho do formData não encontrado')
          text = text.replace(old, new, 1)

          block_start = text.index('    const apiKey =')
          old_text_line = '    const text = extractText(gatewayPayload);\n'
          block_end = text.index(old_text_line, block_start) + len(old_text_line)
          gemini_block = '''    const parts: Array<Record<string, unknown>> = [
      {
        text: `${INSTRUCTIONS}\n\nRetorne exclusivamente um JSON válido, sem markdown, seguindo rigorosamente este esquema:\n${JSON.stringify(RESPONSE_SCHEMA)}`,
      },
      { text: "GRUPO 1 — PEDIDO MCR / RODINI (DOCUMENTO-BASE)" },
    ];

    for (const file of pedidoFiles) {
      parts.push({ text: `Arquivo do pedido-base: ${file.name}` });
      parts.push(await fileToGeminiPart(file));
    }

    parts.push({ text: "GRUPO 2 — DOCUMENTO DO FORNECEDOR" });
    for (const file of fornecedorFiles) {
      parts.push({ text: `Arquivo do fornecedor: ${file.name}` });
      parts.push(await fileToGeminiPart(file));
    }

    const geminiResponse = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": geminiApiKey,
        },
        body: JSON.stringify({
          contents: [{ role: "user", parts }],
          generationConfig: {
            temperature: 0,
            maxOutputTokens: 12000,
            responseMimeType: "application/json",
          },
        }),
        cache: "no-store",
      },
    );

    const geminiPayload = await geminiResponse.json();
    if (!geminiResponse.ok) {
      const message =
        (geminiPayload as { error?: { message?: string } })?.error?.message ||
        "Não foi possível analisar os documentos pelo Google Gemini.";
      return NextResponse.json({ error: message }, { status: 502 });
    }

    const text = extractGeminiText(geminiPayload);
'''
          text = text[:block_start] + gemini_block + text[block_end:]
          route.write_text(text, encoding='utf-8')

          client = Path('timoni-portal/app/dashboard/conferencia-pedidos/ConferenciaPedidosClient.tsx')
          text = client.read_text(encoding='utf-8')
          text = text.replace(
              'import { useRef, useState } from "react";',
              'import { useEffect, useRef, useState } from "react";',
              1,
          )
          text = text.replace(
              '  const [result, setResult] = useState<ConferenciaResult | null>(null);',
              '''  const [result, setResult] = useState<ConferenciaResult | null>(null);
  const [geminiApiKey, setGeminiApiKey] = useState("");

  useEffect(() => {
    setGeminiApiKey(sessionStorage.getItem("timoni-gemini-api-key") || "");
  }, []);

  function updateGeminiApiKey(value: string) {
    setGeminiApiKey(value);
    if (value.trim()) {
      sessionStorage.setItem("timoni-gemini-api-key", value.trim());
    } else {
      sessionStorage.removeItem("timoni-gemini-api-key");
    }
  }''',
              1,
          )
          text = text.replace(
              '''    if (!pedidoFiles.length || !fornecedorFiles.length) {
      setError("Envie o pedido MCR/Rodini e o documento do fornecedor.");
      return;
    }''',
              '''    if (!geminiApiKey.trim()) {
      setError("Cole primeiro a chave gratuita do Google AI Studio.");
      return;
    }

    if (!pedidoFiles.length || !fornecedorFiles.length) {
      setError("Envie o pedido MCR/Rodini e o documento do fornecedor.");
      return;
    }''',
              1,
          )
          text = text.replace(
              '''      const formData = new FormData();
      optimizedPedido.forEach((file) => formData.append("pedido", file));''',
              '''      const formData = new FormData();
      formData.append("geminiApiKey", geminiApiKey.trim());
      optimizedPedido.forEach((file) => formData.append("pedido", file));''',
              1,
          )
          text = text.replace(
              '''  return (
    <div>
      <div className="grid gap-4 lg:grid-cols-2">''',
              '''  return (
    <div>
      <section className="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-end">
          <label className="flex-1">
            <span className="text-sm font-semibold text-emerald-950">
              Chave gratuita do Google AI Studio
            </span>
            <input
              type="password"
              value={geminiApiKey}
              disabled={loading}
              onChange={(event) => updateGeminiApiKey(event.target.value)}
              placeholder="Cole aqui a chave que começa com AIza..."
              autoComplete="off"
              className="mt-2 min-h-12 w-full rounded-xl border border-emerald-300 bg-white px-4 text-sm text-slate-900 outline-none focus:border-emerald-600"
            />
          </label>
          <a
            href="https://aistudio.google.com/app/apikey"
            target="_blank"
            rel="noreferrer"
            className="inline-flex min-h-12 items-center justify-center rounded-xl border border-emerald-700 bg-white px-5 text-sm font-semibold text-emerald-800 hover:bg-emerald-100"
          >
            Criar chave gratuita
          </a>
        </div>
        <p className="mt-2 text-xs leading-5 text-emerald-900/70">
          A chave fica somente nesta aba do navegador e não é armazenada no Portal Timoni.
        </p>
      </section>

      <div className="grid gap-4 lg:grid-cols-2">''',
              1,
          )
          text = text.replace(
              'disabled={loading || !pedidoFiles.length || !fornecedorFiles.length}',
              'disabled={loading || !geminiApiKey.trim() || !pedidoFiles.length || !fornecedorFiles.length}',
              1,
          )
          client.write_text(text, encoding='utf-8')

          page = Path('timoni-portal/app/dashboard/conferencia-pedidos/page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace('title: "Conferência de pedidos"', 'title: "Conferência de Preços"')
          text = text.replace('Conferência de pedidos', 'Conferência de Preços')
          page.write_text(text, encoding='utf-8')

          dashboard = Path('timoni-portal/app/dashboard/page.tsx')
          text = dashboard.read_text(encoding='utf-8')
          text = text.replace('name:"Conferência de pedidos"', 'name:"Conferência de Preços"')
          dashboard.write_text(text, encoding='utf-8')

          layout = Path('timoni-portal/app/dashboard/layout.tsx')
          text = layout.read_text(encoding='utf-8')
          text = text.replace('>Conferência</Link>', '>Conferência de Preços</Link>')
          layout.write_text(text, encoding='utf-8')
          PY

      - name: Validar build
        working-directory: timoni-portal
        run: npm ci && npm run build

      - name: Publicar alteracoes
        run: |
          rm .github/workflows/switch-conferencia-gemini.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/api/conferencia-pedidos/route.ts \
                  timoni-portal/app/dashboard/conferencia-pedidos/ConferenciaPedidosClient.tsx \
                  timoni-portal/app/dashboard/conferencia-pedidos/page.tsx \
                  timoni-portal/app/dashboard/page.tsx \
                  timoni-portal/app/dashboard/layout.tsx \
                  .github/workflows/switch-conferencia-gemini.yml
          git commit -m "Switch conference module to Google Gemini free quota"
          git push origin main

# trigger
