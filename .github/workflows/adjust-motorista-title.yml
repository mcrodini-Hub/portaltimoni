name: Ajustar titulo motorista
on:
  push:
    paths:
      - '.github/workflows/adjust-motorista-title.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar titulo
        shell: python
        run: |
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text(encoding='utf-8')
          old = '<p className="text-sm font-semibold text-slate-950">{index + 1}. {horaCurta(v.horario)}{v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""} · {v.tipoHorario || "Viagem"} · {lojaLabel(v.loja)}</p>'
          new = '<p className="text-sm font-semibold text-slate-950">{index + 1}. {v.tipoHorario || "Viagem"} {lojaLabel(v.loja)} | {horaCurta(v.horario)}{v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""}</p>'
          if old not in s:
              raise SystemExit('Titulo atual nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git commit -m "fix: ajusta titulo dos cards do motorista"
          git push