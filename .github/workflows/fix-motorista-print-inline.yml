name: Corrigir impressao motorista
on:
  push:
    paths:
      - '.github/workflows/fix-motorista-print-inline.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir impressao e layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  const [erro, setErro] = useState("");\n  const [invalidos, setInvalidos]', '  const [erro, setErro] = useState("");\n  const [printing, setPrinting] = useState(false);\n  const [invalidos, setInvalidos]', 1)

          start = s.index('  function imprimirDia() {')
          end = s.index('\n\n  const itensDia =', start)
          nova = '''  function imprimirDia() {\n    const itens = (viagens[selecionado] || []).filter((v) => v.tipoHorario !== "Bloqueio");\n    if (!itens.length) {\n      setErro("Não há entregas ou retiradas neste dia para imprimir.");\n      return;\n    }\n    setErro("");\n    setPrinting(true);\n    window.setTimeout(() => {\n      window.print();\n      setPrinting(false);\n    }, 80);\n  }'''
          s = s[:start] + nova + s[end:]

          marker = '    <>\n      <section className="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm sm:p-5">'
          print_block = '''    <>\n      <style>{`\n        @media screen { .motorista-print { display: none; } }\n        @media print {\n          body * { visibility: hidden !important; }\n          .motorista-print, .motorista-print * { visibility: visible !important; }\n          .motorista-print { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 0; font-family: Arial, sans-serif; color: #000; }\n          .motorista-print .print-item { margin: 0 0 18pt 0; page-break-inside: avoid; }\n          .motorista-print p { margin: 0 0 5pt 0; font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.3; }\n          .motorista-print .preenchido { font-size: 10pt; margin-top: 8pt; }\n          .motorista-print h1 { margin: 0 0 20pt 0; font-family: Arial, sans-serif; font-size: 11pt; font-weight: 700; }\n          @page { size: A4; margin: 16mm; }\n        }\n      `}</style>\n\n      {printing && (\n        <div className="motorista-print">\n          <h1>AGENDA MOTORISTA - DIA {dataSelecionada.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })} - {dataSelecionada.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "")}</h1>\n          {itensDia.filter((v) => v.tipoHorario !== "Bloqueio").map((v, index) => (\n            <div key={v.id} className="print-item">\n              <p><strong>{index + 1}. {v.tipoHorario || "Entrega"} {lojaLabel(v.loja)} | {horaCurta(v.horario)}{v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""}{v.vendedor ? ` | Vendedor: ${v.vendedor}` : ""}</strong></p>\n              <p>{v.clienteFornecedor || ""}{v.numeroPedido ? ` · ${v.numeroPedido}` : ""}{v.volumes ? ` · Volume: ${v.volumes}` : ""}</p>\n              {v.endereco && <p>{[v.endereco, v.numero, v.complemento].filter(Boolean).join(" - ")}</p>}\n              {(v.contatoNome || v.contatoWhats) && <p>Contato: {[v.contatoNome, v.contatoWhats].filter(Boolean).join(" - ")}</p>}\n              {v.info && <p>Observação: {v.info}</p>}\n              {v.preenchidoPor && <p className="preenchido">Preenchido por: {v.preenchidoPor}</p>}\n            </div>\n          ))}\n        </div>\n      )}\n\n      <section className="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm sm:p-5">'''
          if marker in s:
              s = s.replace(marker, print_block, 1)
          else:
              raise SystemExit('marker de return não encontrado')

          old = '''                    <p className="text-sm font-semibold text-slate-950">{index + 1}. {v.tipoHorario || "Viagem"} {lojaLabel(v.loja)} | {horaCurta(v.horario)}{v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""}</p>\n                    {v.vendedor && <p className="mt-1 text-xs text-slate-600">Vendedor: {v.vendedor}</p>}'''
          new = '''                    <p className="font-[Arial] text-[11pt] font-semibold text-slate-950">{index + 1}. {v.tipoHorario || "Viagem"} {lojaLabel(v.loja)} | {horaCurta(v.horario)}{v.horarioFim ? ` a ${horaCurta(v.horarioFim)}` : ""}{v.vendedor ? ` | Vendedor: ${v.vendedor}` : ""}</p>'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('titulo antigo não encontrado')

          s = s.replace('className="mt-2 text-sm font-medium text-slate-900"', 'className="mt-2 font-[Arial] text-[11pt] font-normal text-slate-900"', 1)
          s = s.replace('className="mt-1 text-sm text-slate-700"', 'className="mt-1 font-[Arial] text-[11pt] text-slate-700"', 2)
          s = s.replace('className="mt-2 text-sm text-slate-600"', 'className="mt-2 font-[Arial] text-[11pt] text-slate-600"', 1)
          s = s.replace('className="mt-3 font-[Arial] text-[9px] text-slate-500"', 'className="mt-3 font-[Arial] text-[10pt] text-slate-500"', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: imprime motorista na propria pagina e alinha layout"
          git push