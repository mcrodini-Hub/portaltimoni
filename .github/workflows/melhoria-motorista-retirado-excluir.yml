name: Melhoria Motorista Retirado e Excluir

on:
  push:
    branches: [melhoria-motorista-retirado-excluir]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar melhoria isolada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text()

          anchor = '''function notasComConclusao(notasJson: string | undefined, observacao: string) {\n  let base: Record<string, unknown> = {};\n  try {\n    const parsed = JSON.parse(String(notasJson || "[]"));\n    base = Array.isArray(parsed) ? { legado: parsed } : parsed && typeof parsed === "object" ? parsed : {};\n  } catch {}\n  return JSON.stringify({ ...base, status: "concluida", observacaoConclusao: observacao.trim(), concluidoEm: new Date().toISOString() });\n}\n'''
          addition = anchor + '''\nfunction lerRetirada(notasJson?: string) {\n  try {\n    const parsed = JSON.parse(String(notasJson || "[]"));\n    if (parsed && !Array.isArray(parsed) && parsed.status === "retirado") return parsed as { status: string; retiradoEm?: string };\n  } catch {}\n  return null;\n}\n\nfunction notasComRetirada(notasJson?: string) {\n  let base: Record<string, unknown> = {};\n  try {\n    const parsed = JSON.parse(String(notasJson || "[]"));\n    base = Array.isArray(parsed) ? { legado: parsed } : parsed && typeof parsed === "object" ? parsed : {};\n  } catch {}\n  return JSON.stringify({ ...base, status: "retirado", retiradoEm: new Date().toISOString() });\n}\n'''
          if anchor not in s:
              raise SystemExit('anchor helpers nao encontrado')
          s = s.replace(anchor, addition, 1)

          old_guard = '    if (v.tipoHorario === "Bloqueio" || lerConclusao(v.notasJson)) return;'
          new_guard = '    if (v.tipoHorario === "Bloqueio" || lerConclusao(v.notasJson) || lerRetirada(v.notasJson)) return;'
          if old_guard not in s:
              raise SystemExit('guard concluir nao encontrado')
          s = s.replace(old_guard, new_guard, 1)

          anchor_func = '''  async function concluirViagem(v: Viagem) {\n    if (v.tipoHorario === "Bloqueio" || lerConclusao(v.notasJson) || lerRetirada(v.notasJson)) return;\n    const observacao = window.prompt("Observação da conclusão (opcional):", "");\n    if (observacao === null) return;\n    setSaving(true);\n    setErro("");\n    try {\n      const payload = new URLSearchParams({\n        action: "atualizar",\n        id: v.id,\n        notasJson: notasComConclusao(v.notasJson, observacao),\n      });\n      const response = await fetch("/api/agenda-motorista", {\n        method: "POST",\n        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },\n        body: payload,\n      });\n      await parseResponse(response);\n      await carregarDia(v.data);\n    } catch (e) {\n      setErro(e instanceof Error ? e.message : "Não foi possível concluir a viagem.");\n    } finally {\n      setSaving(false);\n    }\n  }\n'''
          funcs = anchor_func + '''\n  async function retirarViagem(v: Viagem) {\n    if (v.tipoHorario === "Bloqueio" || lerConclusao(v.notasJson) || lerRetirada(v.notasJson)) return;\n    if (!window.confirm("Marcar esta viagem como retirada?")) return;\n    setSaving(true);\n    setErro("");\n    try {\n      const payload = new URLSearchParams({\n        action: "atualizar",\n        id: v.id,\n        notasJson: notasComRetirada(v.notasJson),\n      });\n      const response = await fetch("/api/agenda-motorista", {\n        method: "POST",\n        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },\n        body: payload,\n      });\n      await parseResponse(response);\n      await carregarDia(v.data);\n    } catch (e) {\n      setErro(e instanceof Error ? e.message : "Não foi possível marcar como retirado.");\n    } finally {\n      setSaving(false);\n    }\n  }\n\n  async function excluirViagem(v: Viagem) {\n    if (!window.confirm("Excluir esta viagem definitivamente?")) return;\n    setSaving(true);\n    setErro("");\n    try {\n      const payload = new URLSearchParams({ action: "excluir", id: v.id });\n      const response = await fetch("/api/agenda-motorista", {\n        method: "POST",\n        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },\n        body: payload,\n      });\n      await parseResponse(response);\n      await carregarDia(v.data);\n    } catch (e) {\n      setErro(e instanceof Error ? e.message : "Não foi possível excluir a viagem.");\n    } finally {\n      setSaving(false);\n    }\n  }\n'''
          if anchor_func not in s:
              raise SystemExit('func concluir nao encontrada')
          s = s.replace(anchor_func, funcs, 1)

          old_week = '''                          {v.tipoHorario !== "Bloqueio" && (lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-1.5 text-xs font-semibold text-emerald-800">Concluído</span> : <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Concluir</button>)}\n                          <button type="button" onClick={() => abrirEditar(v)} className="rounded-lg border border-blue-200 bg-white px-3 py-1.5 text-xs font-semibold text-blue-800 hover:bg-blue-50">Editar</button>'''
          new_week = '''                          {v.tipoHorario !== "Bloqueio" && (lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-1.5 text-xs font-semibold text-emerald-800">Concluído</span> : lerRetirada(v.notasJson) ? <span className="rounded-lg bg-amber-100 px-3 py-1.5 text-xs font-semibold text-amber-800">Retirado</span> : <>\n                            <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Concluir</button>\n                            <button type="button" disabled={saving} onClick={() => void retirarViagem(v)} className="rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Retirado</button>\n                          </>)}\n                          <button type="button" onClick={() => abrirEditar(v)} className="rounded-lg border border-blue-200 bg-white px-3 py-1.5 text-xs font-semibold text-blue-800 hover:bg-blue-50">Editar</button>\n                          <button type="button" disabled={saving} onClick={() => void excluirViagem(v)} className="rounded-lg border border-red-200 bg-white px-3 py-1.5 text-xs font-semibold text-red-700 hover:bg-red-50 disabled:opacity-60">Excluir</button>'''
          if old_week not in s:
              raise SystemExit('botoes semana nao encontrados')
          s = s.replace(old_week, new_week, 1)

          old_day = '''                    {v.tipoHorario !== "Bloqueio" && (lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-2 text-sm font-semibold text-emerald-800">Concluído</span> : <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Concluir</button>)}\n                    <button type="button" onClick={() => abrirEditar(v)} className="rounded-lg border border-blue-200 bg-white px-3 py-2 text-sm font-semibold text-blue-800 hover:bg-blue-50">Editar</button>'''
          new_day = '''                    {v.tipoHorario !== "Bloqueio" && (lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-2 text-sm font-semibold text-emerald-800">Concluído</span> : lerRetirada(v.notasJson) ? <span className="rounded-lg bg-amber-100 px-3 py-2 text-sm font-semibold text-amber-800">Retirado</span> : <>\n                      <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Concluir</button>\n                      <button type="button" disabled={saving} onClick={() => void retirarViagem(v)} className="rounded-lg bg-amber-600 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Retirado</button>\n                    </>)}\n                    <button type="button" onClick={() => abrirEditar(v)} className="rounded-lg border border-blue-200 bg-white px-3 py-2 text-sm font-semibold text-blue-800 hover:bg-blue-50">Editar</button>\n                    <button type="button" disabled={saving} onClick={() => void excluirViagem(v)} className="rounded-lg border border-red-200 bg-white px-3 py-2 text-sm font-semibold text-red-700 hover:bg-red-50 disabled:opacity-60">Excluir</button>'''
          if old_day not in s:
              raise SystemExit('botoes dia nao encontrados')
          s = s.replace(old_day, new_day, 1)

          p.write_text(s)
          PY
      - name: Instalar dependências
        working-directory: timoni-portal
        run: npm ci
      - name: Validar build
        working-directory: timoni-portal
        run: npm run build
      - name: Commit na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git diff --cached --quiet || git commit -m "feat: adiciona Retirado e Excluir na Agenda Motorista"
          git push
