name: Ajuste Agenda dias uteis

on:
  push:
    branches: [ajuste-agenda-dias-uteis-clean]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste isolado
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text()

          old = '''function weekDays(value: string) {\n  const base = dateFromString(value);\n  const day = base.getDay();\n  const diffToMonday = day === 0 ? -6 : 1 - day;\n  const monday = new Date(base.getFullYear(), base.getMonth(), base.getDate() + diffToMonday);\n  return Array.from({ length: 7 }, (_, index) =>\n    new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + index),\n  );\n}\n'''
          new = '''function weekDays(value: string) {\n  const base = dateFromString(value);\n  return Array.from({ length: 7 }, (_, index) =>\n    new Date(base.getFullYear(), base.getMonth(), base.getDate() + index),\n  ).filter((d) => d.getDay() !== 0 && d.getDay() !== 6);\n}\n'''
          if old not in s:
              raise SystemExit('weekDays não encontrado')
          s = s.replace(old, new)

          old_header = '''                <p className="text-xs font-semibold uppercase tracking-[0.14em] text-blue-700">Agenda da semana</p>\n                <p className="mt-1 text-sm text-slate-600">Segunda a domingo</p>'''
          new_header = '''                <p className="text-xs font-semibold uppercase tracking-[0.14em] text-blue-700">Agenda da semana</p>\n                <p className="mt-1 text-sm text-slate-600">{selecionado === hoje ? "A partir de hoje" : "A partir do dia selecionado"} · sem sábado e domingo</p>'''
          if old_header not in s:
              raise SystemExit('cabeçalho semanal não encontrado')
          s = s.replace(old_header, new_header)

          old_buttons = '''                <button type="button" onClick={() => { const d = dateFromString(selecionado); d.setDate(d.getDate() - 7); setSelecionado(localDateString(d)); }} className="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700">← Semana anterior</button>\n                <button type="button" onClick={() => setSelecionado(hoje)} className="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700">Hoje</button>\n                <button type="button" onClick={() => { const d = dateFromString(selecionado); d.setDate(d.getDate() + 7); setSelecionado(localDateString(d)); }} className="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700">Próxima semana →</button>'''
          new_buttons = '''                <button type="button" onClick={() => { const d = dateFromString(selecionado); d.setDate(d.getDate() - 7); setSelecionado(localDateString(d)); }} className="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700">− 7 dias</button>\n                <button type="button" onClick={() => setSelecionado(hoje)} className="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700">Hoje</button>\n                <button type="button" onClick={() => { const d = dateFromString(selecionado); d.setDate(d.getDate() + 7); setSelecionado(localDateString(d)); }} className="rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-700">+ 7 dias</button>'''
          if old_buttons not in s:
              raise SystemExit('botões semanais não encontrados')
          s = s.replace(old_buttons, new_buttons)

          p.write_text(s)
          PY
      - name: Instalar dependências
        working-directory: timoni-portal
        run: npm ci
      - name: Validar build
        working-directory: timoni-portal
        run: npm run build
      - name: Commit na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git diff --cached --quiet || git commit -m "fix: padroniza navegação semanal da Agenda Motorista"
          git push
