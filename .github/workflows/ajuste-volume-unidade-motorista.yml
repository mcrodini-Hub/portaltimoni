name: Ajuste Volume e Unidade Motorista

on:
  push:
    branches: [ajuste-volume-unidade-motorista]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste isolado
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text()

          s = s.replace('  volumes: string;\n  contatoNome: string;', '  volumes: string;\n  unidadeVolume: string;\n  contatoNome: string;')
          s = s.replace('    volumes: "",\n    contatoNome: "",', '    volumes: "",\n    unidadeVolume: "",\n    contatoNome: "",')
          s = s.replace('  const match = enderecoCompleto.match(/\\nLink:\\s*(https?:\\/\\/\\S+)/i);\n  return {', '  const match = enderecoCompleto.match(/\\nLink:\\s*(https?:\\/\\/\\S+)/i);\n  const volumeInfo = separarVolume(v.volumes);\n  return {')
          s = s.replace('    volumes: v.volumes || "",\n    contatoNome: v.contatoNome || "",', '    volumes: volumeInfo.volume,\n    unidadeVolume: volumeInfo.unidade,\n    contatoNome: v.contatoNome || "",')

          marker = '''function pedidoTexto(valor?: string) {\n  return String(valor ?? "").replace(/\\s*\\/\\s*/g, " ").replace(/\\s+/g, " ").trim();\n}\n'''
          replacement = marker + '''\nfunction separarVolume(valor?: string) {\n  const texto = String(valor ?? "").trim();\n  const marcador = " | Unidade: ";\n  const indice = texto.indexOf(marcador);\n  if (indice < 0) return { volume: texto, unidade: "" };\n  return {\n    volume: texto.slice(0, indice).trim(),\n    unidade: texto.slice(indice + marcador.length).trim(),\n  };\n}\n\nfunction formatarVolume(volume?: string, unidade?: string) {\n  const vol = String(volume ?? "").trim();\n  const un = String(unidade ?? "").trim();\n  return un ? `${vol} | Unidade: ${un}` : vol;\n}\n'''
          if marker not in s:
              raise SystemExit('marker pedidoTexto não encontrado')
          s = s.replace(marker, replacement)

          s = s.replace('        volumes: form.volumes,', '        volumes: formatarVolume(form.volumes, form.unidadeVolume),')

          old = '<label className="text-sm font-medium text-slate-700">* Volume<input value={form.volumes} onChange={(e) => set("volumes", e.target.value)} className={fieldClass("volumes")} /></label>'
          new = '<div className="grid gap-4 sm:grid-cols-2"><label className="text-sm font-medium text-slate-700">* Volume<input value={form.volumes} onChange={(e) => set("volumes", e.target.value)} className={fieldClass("volumes")} /></label><label className="text-sm font-medium text-slate-700">Unidade<input value={form.unidadeVolume} onChange={(e) => set("unidadeVolume", e.target.value)} placeholder="Ex.: caixa, pallet, kg" className={fieldClass("unidadeVolume")} /></label></div>'
          if old not in s:
              raise SystemExit('campo Volume não encontrado')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Instalar dependências
        working-directory: timoni-portal
        run: npm ci
      - name: Validar build
        working-directory: timoni-portal
        run: npm run build
      - name: Commit na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git diff --cached --quiet || git commit -m "feat: adiciona Unidade ao Volume no Motorista"
          git push
