<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motorista · Portal Timoni</title>
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="icons/icon48.png" alt="Casa Timoni">
    <span class="brand-title">Agenda do Motorista <span class="brand-dim">· Portal Timoni</span></span>
  </div>
  <div class="topbar-actions" id="lojaPillWrap" hidden></div>
</header>

<main class="content">
  <section class="intro">
    <div>
      <p class="eyebrow">SOMENTE LEITURA</p>
      <h1>Hoje e próximos 7 dias</h1>
      <p class="subtitle">Todos os agendamentos aparecem juntos, em ordem de data e horário.</p>
    </div>
    <p id="atualizadoEm" class="updated"></p>
  </section>

  <div id="status" class="status" role="status">Carregando agenda...</div>
  <section id="agenda" class="agenda" aria-live="polite"></section>
</main>

<script src="lib/store.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
