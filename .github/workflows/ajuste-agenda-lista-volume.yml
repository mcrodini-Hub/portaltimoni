name: Ajuste Agenda lista e Volume

on:
  push:
    branches: [ajuste-agenda-lista-volume]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste isolado
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text()

          s = s.replace('const [modo, setModo] = useState<Modo>("dia");', 'const [modo, setModo] = useState<Modo>("semana");')

          old = '''function separarVolume(valor?: string) {\n  const texto = String(valor ?? "").trim();\n  const marcador = " | Unidade: ";\n  const indice = texto.indexOf(marcador);\n  if (indice < 0) return { volume: texto, unidade: "" };\n  return {\n    volume: texto.slice(0, indice).trim(),\n    unidade: texto.slice(indice + marcador.length).trim(),\n  };\n}\n\nfunction formatarVolume(volume?: string, unidade?: string) {\n  const vol = String(volume ?? "").trim();\n  const un = String(unidade ?? "").trim();\n  return un ? `${vol} | Unidade: ${un}` : vol;\n}\n'''
          new = '''function separarVolume(valor?: string) {\n  const texto = String(valor ?? "").trim();\n  const marcador = " | Unidade: ";\n  const indice = texto.indexOf(marcador);\n  if (indice >= 0) {\n    return {\n      volume: texto.slice(0, indice).trim(),\n      unidade: texto.slice(indice + marcador.length).trim(),\n    };\n  }\n  const combinado = texto.match(/^(\\S+)\\s+(.+)$/);\n  return combinado ? { volume: combinado[1], unidade: combinado[2].trim() } : { volume: texto, unidade: "" };\n}\n\nfunction formatarVolume(volume?: string, unidade?: string) {\n  const vol = String(volume ?? "").trim();\n  const un = String(unidade ?? "").trim();\n  return [vol, un].filter(Boolean).join(" ");\n}\n'''
          if old not in s:
              raise SystemExit('helpers de volume não encontrados')
          s = s.replace(old, new)

          old_week = '<div className="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-3">'
          new_week = '<div className="mt-4 space-y-4">'
          if old_week not in s:
              raise SystemExit('layout semanal não encontrado')
          s = s.replace(old_week, new_week, 1)

          p.write_text(s)
          PY
      - name: Instalar dependências
        working-directory: timoni-portal
        run: npm ci
      - name: Validar build
        working-directory: timoni-portal
        run: npm run build
      - name: Commit na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git diff --cached --quiet || git commit -m "fix: padroniza lista semanal e Volume no Motorista"
          git push
