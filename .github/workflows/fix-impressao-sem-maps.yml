name: Fix impressao sem Google Maps

on:
  push:
    branches: [fix-impressao-sem-maps]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover link do Maps somente da impressao
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text()
          old = '      const endereco = [v.endereco, v.numero, v.complemento].filter(Boolean).join(" - ");'
          new = '      const endereco = [separarEndereco(v.endereco).texto, v.numero, v.complemento].filter(Boolean).join(" - ");'
          if old not in s:
              raise SystemExit('linha da impressao nao encontrada')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build
        working-directory: timoni-portal
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          git diff --cached --quiet || git commit -m "fix: remove Google Maps da impressao do Motorista"
          git push
