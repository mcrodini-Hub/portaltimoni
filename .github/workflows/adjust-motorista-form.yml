name: Ajustar formulario motorista
on:
  push:
    paths:
      - '.github/workflows/adjust-motorista-form.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar campos
        shell: python
        run: |
          from pathlib import Path
          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  endereco: string;\n  linkEndereco: string;', '  cep: string;\n  endereco: string;\n  linkEndereco: string;', 1)
          s = s.replace('  "clienteFornecedor",\n  "contatoNome",', '  "clienteFornecedor",\n  "volumes",\n  "contatoNome",', 1)
          s = s.replace('    contatoWhats: "",\n    endereco: "",', '    contatoWhats: "",\n    cep: "",\n    endereco: "",', 1)
          s = s.replace('    contatoWhats: v.contatoWhats || "",\n    endereco:', '    contatoWhats: v.contatoWhats || "",\n    cep: "",\n    endereco:', 1)

          marker = 'function horaCurta(hora?: string) {\n  return hora ? hora.slice(0, 5) : "--:--";\n}\n'
          helpers = marker + '''\nfunction formatarCep(value: string) {\n  const digits = value.replace(/\\D/g, "").slice(0, 8);\n  return digits.length > 5 ? `${digits.slice(0, 5)}-${digits.slice(5)}` : digits;\n}\n\nfunction formatarTelefone(value: string) {\n  const digits = value.replace(/\\D/g, "").slice(0, 11);\n  if (digits.length <= 2) return digits;\n  const ddd = digits.slice(0, 2);\n  const numero = digits.slice(2);\n  if (numero.length <= 4) return `${ddd} ${numero}`;\n  if (numero.length <= 8) return `${ddd} ${numero.slice(0, 4)}-${numero.slice(4)}`;\n  return `${ddd} ${numero.slice(0, 5)}-${numero.slice(5)}`;\n}\n'''
          if 'function formatarTelefone' not in s:
              s = s.replace(marker, helpers, 1)

          insert_after = '''  function set<K extends keyof FormState>(key: K, value: FormState[K]) {\n    setForm((current) => ({ ...current, [key]: value }));\n    setInvalidos((current) => {\n      if (!current.has(key)) return current;\n      const next = new Set(current);\n      next.delete(key);\n      return next;\n    });\n  }\n'''
          buscar = insert_after + '''\n  async function buscarCep() {\n    const cep = form.cep.replace(/\\D/g, "");\n    if (cep.length !== 8) {\n      setErro("Digite um CEP com 8 números.");\n      return;\n    }\n    setErro("");\n    try {\n      const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);\n      const data = await response.json();\n      if (!response.ok || data.erro) throw new Error("CEP não encontrado.");\n      const endereco = [data.logradouro, data.bairro, [data.localidade, data.uf].filter(Boolean).join("/")].filter(Boolean).join(" - ");\n      set("endereco", endereco);\n    } catch (e) {\n      setErro(e instanceof Error ? e.message : "Não foi possível buscar o CEP.");\n    }\n  }\n'''
          if 'async function buscarCep()' not in s:
              s = s.replace(insert_after, buscar, 1)

          s = s.replace('>Volume<input value={form.volumes}', '>* Volume<input value={form.volumes}', 1)
          s = s.replace('value={form.contatoWhats} onChange={(e) => set("contatoWhats", e.target.value)}', 'value={form.contatoWhats} onChange={(e) => set("contatoWhats", formatarTelefone(e.target.value))} inputMode="tel" placeholder="19 98181-9171"', 1)

          endereco_label = '<label className="text-sm font-medium text-slate-700">* Endereço<input value={form.endereco} onChange={(e) => set("endereco", e.target.value)} className={fieldClass("endereco")} /></label>'
          cep_block = '''<div className="grid gap-2 sm:grid-cols-[220px_auto] sm:items-end"><label className="text-sm font-medium text-slate-700">CEP<input value={form.cep} onChange={(e) => set("cep", formatarCep(e.target.value))} inputMode="numeric" placeholder="00000-000" className={fieldClass("cep")} /></label><button type="button" onClick={buscarCep} className="h-[42px] rounded-lg border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 hover:bg-slate-50">Buscar CEP</button></div>\n              ''' + endereco_label
          if '>CEP<input' not in s:
              s = s.replace(endereco_label, cep_block, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: exige volume e adiciona CEP e mascara de telefone"
          git push