name: Fix Motorista status finalizado

on:
  push:
    branches: [fix-motorista-status-finalizado]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste isolado
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('timoni-portal/app/motorista/motorista-leitura.tsx')
          s = p.read_text()
          old = '''function concluida(notasJson?: string) {\n  try {\n    const parsed = JSON.parse(String(notasJson || "[]"));\n    return Boolean(parsed && !Array.isArray(parsed) && parsed.status === "concluida");\n  } catch {\n    return false;\n  }\n}\n'''
          new = '''function finalizada(notasJson?: string) {\n  try {\n    const parsed = JSON.parse(String(notasJson || "[]"));\n    if (!parsed || Array.isArray(parsed)) return false;\n    return parsed.status === "concluida" || parsed.status === "feito";\n  } catch {\n    return false;\n  }\n}\n'''
          if old not in s:
              raise SystemExit('helper concluida nao encontrado')
          s = s.replace(old, new, 1)
          s = s.replace('(viagens[data] || []).filter((v) => !concluida(v.notasJson))', '(viagens[data] || []).filter((v) => !finalizada(v.notasJson))')
          s = s.replace('                                {!bloqueio && concluida(v.notasJson) && <span className="rounded-lg bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-800">Concluído</span>}\n', '')
          p.write_text(s)

          r = Path('timoni-portal/app/api/motorista-leitura/route.ts')
          t = r.read_text()
          t = t.replace('    status: "feito",\n    feitoEm: new Date().toISOString(),', '    status: "concluida",\n    concluidoEm: new Date().toISOString(),')
          r.write_text(t)
          PY
      - name: Instalar dependências
        working-directory: timoni-portal
        run: npm ci
      - name: Validar build
        working-directory: timoni-portal
        run: npm run build
      - name: Commit na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/motorista/motorista-leitura.tsx timoni-portal/app/api/motorista-leitura/route.ts
          git diff --cached --quiet || git commit -m "fix: alinha status finalizado do Motorista"
          git push
