name: debug-build
on:
  push:
    branches:
      - estoque-rotativo-padronizacao-controlada
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timoni-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: timoni-portal/package-lock.json
      - run: npm ci
      - run: npm run build
