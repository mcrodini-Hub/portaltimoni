name: Fix Retirado pos Concluido
on:
  push:
    branches: [fix-retirado-pos-concluido]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar logica
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s=p.read_text()
          s=s.replace('if (v.tipoHorario === "Bloqueio" || lerConclusao(v.notasJson) || lerRetirada(v.notasJson)) return;\n    if (!window.confirm("Marcar esta viagem como retirada?")) return;','if (v.tipoHorario === "Bloqueio" || lerRetirada(v.notasJson)) return;\n    if (!window.confirm("Marcar esta viagem como retirada?")) return;',1)
          s=s.replace('{v.tipoHorario !== "Bloqueio" && (lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-1.5 text-xs font-semibold text-emerald-800">Concluído</span> : lerRetirada(v.notasJson) ? <span className="rounded-lg bg-amber-100 px-3 py-1.5 text-xs font-semibold text-amber-800">Retirado</span> : <>\n                            <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Concluir</button>\n                            <button type="button" disabled={saving} onClick={() => void retirarViagem(v)} className="rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Retirado</button>\n                          </>)}','{v.tipoHorario !== "Bloqueio" && (lerRetirada(v.notasJson) ? <span className="rounded-lg bg-amber-100 px-3 py-1.5 text-xs font-semibold text-amber-800">Retirado</span> : <>\n                            {lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-1.5 text-xs font-semibold text-emerald-800">Concluído</span> : <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Concluir</button>}\n                            <button type="button" disabled={saving} onClick={() => void retirarViagem(v)} className="rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60">Retirado</button>\n                          </>)}',1)
          s=s.replace('{v.tipoHorario !== "Bloqueio" && (lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-2 text-sm font-semibold text-emerald-800">Concluído</span> : lerRetirada(v.notasJson) ? <span className="rounded-lg bg-amber-100 px-3 py-2 text-sm font-semibold text-amber-800">Retirado</span> : <>\n                      <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Concluir</button>\n                      <button type="button" disabled={saving} onClick={() => void retirarViagem(v)} className="rounded-lg bg-amber-600 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Retirado</button>\n                    </>)}','{v.tipoHorario !== "Bloqueio" && (lerRetirada(v.notasJson) ? <span className="rounded-lg bg-amber-100 px-3 py-2 text-sm font-semibold text-amber-800">Retirado</span> : <>\n                      {lerConclusao(v.notasJson) ? <span className="rounded-lg bg-emerald-100 px-3 py-2 text-sm font-semibold text-emerald-800">Concluído</span> : <button type="button" disabled={saving} onClick={() => void concluirViagem(v)} className="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Concluir</button>}\n                      <button type="button" disabled={saving} onClick={() => void retirarViagem(v)} className="rounded-lg bg-amber-600 px-3 py-2 text-sm font-semibold text-white disabled:opacity-60">Retirado</button>\n                    </>)}',1)
          p.write_text(s)

          q=Path('timoni-portal/app/motorista/motorista-leitura.tsx')
          t=q.read_text()
          if 'function finalizada' not in t:
              t=t.replace('function concluida(notasJson?: string) {','function finalizada(notasJson?: string) {\n  try {\n    const parsed = JSON.parse(String(notasJson || "[]"));\n    return Boolean(parsed && !Array.isArray(parsed) && (parsed.status === "concluida" || parsed.status === "retirado" || parsed.status === "feito"));\n  } catch {\n    return false;\n  }\n}\n\nfunction concluida(notasJson?: string) {',1)
          t=t.replace('(viagens[data] || []).filter((v) => !concluida(v.notasJson))','(viagens[data] || []).filter((v) => !finalizada(v.notasJson))',1)
          q.write_text(t)
          PY
      - name: Build
        working-directory: timoni-portal
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx timoni-portal/app/motorista/motorista-leitura.tsx
          git diff --cached --quiet || git commit -m "fix: mantém Retirado após Concluído"
          git push
