name: Finaliza motorista preenchido por
on:
  push:
    paths:
      - '.github/workflows/finaliza-motorista-preenchido.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cards e impressao
        shell: python
        run: |
          from pathlib import Path

          p = Path('timoni-portal/app/dashboard/motorista/motorista-agenda.tsx')
          s = p.read_text(encoding='utf-8')

          old = '${v.info ? `<p>Observação: ${v.info}</p>` : ""}</div>`;'
          new = '${v.info ? `<p>Observação: ${v.info}</p>` : ""}${v.preenchidoPor ? `<p class="preenchido">Preenchido por: ${v.preenchidoPor}</p>` : ""}</div>`;'
          if old in s:
              s = s.replace(old, new, 1)

          old_css = '.item p{margin:3px 0;font-size:13px;line-height:1.4}'
          new_css = '.item p{margin:3px 0;font-family:Arial,sans-serif;font-size:11pt;line-height:1.35}.item .preenchido{font-size:9pt;margin-top:8px}'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)

          marker = '{v.info && <p className="mt-2 text-sm text-slate-600">Observação: {v.info}</p>}'
          addition = marker + '\n                    {v.preenchidoPor && <p className="mt-3 font-[Arial] text-[9px] text-slate-500">Preenchido por: {v.preenchidoPor}</p>}'
          if marker in s and 'text-[9px] text-slate-500">Preenchido por:' not in s:
              s = s.replace(marker, addition, 1)

          p.write_text(s, encoding='utf-8')

          p2 = Path('timoni-portal/app/motorista/motorista-leitura.tsx')
          s2 = p2.read_text(encoding='utf-8')
          marker2 = '{v.info && <p className="mt-2 text-sm text-slate-600 print:text-base print:text-black">Observação: {v.info}</p>}'
          addition2 = marker2 + '\n                              {v.preenchidoPor && <p className="mt-3 font-[Arial] text-[9px] text-slate-500 print:text-[9pt] print:text-black">Preenchido por: {v.preenchidoPor}</p>}'
          if marker2 in s2 and 'print:text-[9pt] print:text-black">Preenchido por:' not in s2:
              s2 = s2.replace(marker2, addition2, 1)
          s2 = s2.replace('.print-item { border: 0 !important; background: white !important; padding: 0 0 18px 0 !important; }', '.print-item { border: 0 !important; background: white !important; padding: 0 0 18px 0 !important; font-family: Arial, sans-serif !important; font-size: 11pt !important; }')
          s2 = s2.replace('print:text-base', 'print:text-[11pt]')
          p2.write_text(s2, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timoni-portal/app/dashboard/motorista/motorista-agenda.tsx timoni-portal/app/motorista/motorista-leitura.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: inclui preenchido por e padroniza Arial 11 e 9"
          git push